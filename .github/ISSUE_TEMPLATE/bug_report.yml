name: Bug report
description: Report a reproducible local or static-site problem.
title: '[Bug]: '
body:
  - type: input
    id: version
    attributes:
      label: Version or snapshot date
      description: Use the release/tag or the catalogue updated_at date.
      placeholder: v2.0.0 / catalog 2026-09-24
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - GitHub Pages static version
        - Python local version
        - Catalogue/data rebuild
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser/Python version
      placeholder: Windows 11; Chrome 141 / Python 3.14
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove private browser history, local SQLite contents, usernames, and machine paths.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private browsing data, runtime databases, and local machine details.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md for security reports.
          required: true
