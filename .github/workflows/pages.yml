name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Refresh weekly source snapshot
        if: github.event_name == 'schedule'
        run: |
          python catalog.py
          python cache_articles.py
      - name: Backend regression tests
        run: python -m unittest discover -s tests -v
      - name: Build website
        run: python build_site.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Website regression tests
        run: python tests/site_smoke.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
