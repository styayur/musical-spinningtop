name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Python 3.9 builds are available on 24.04, not the 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_catalog.py
      - run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python build_site.py
      - run: python build_site.py --target personal --output artifacts/portable/personal
      - run: python scripts/verify_build.py _site --target github --source-sha "$(git rev-parse HEAD)"
      - run: python scripts/verify_build.py artifacts/portable/personal --target personal --source-sha "$(git rev-parse HEAD)"
      - run: python -m playwright install --with-deps chromium
      - run: python tests/site_smoke.py
      - run: python tests/ui_extra_smoke.py
      - run: python tests/sharing_smoke.py
      - run: python tests/sharing_flask_smoke.py
      - run: python tests/sharing_flask_smoke.py --target personal
      - run: python tests/portable_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-deployment-evidence
          path: |
            artifacts/portable/comparison.json
            _site/build-manifest.json
            artifacts/portable/personal/build-manifest.json
